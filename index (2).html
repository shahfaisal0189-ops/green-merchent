<style>
:root{--bg:#F5F3EE;--card:#fff;--ink:#1E1B16;--ink2:#5B554B;--ink3:#8A8377;--line:#E2DDD2;--line2:#CFC8BA;--acc:#9C6B0E;--acc-soft:#F6ECD8;--good:#137A3A;--good-soft:#E5F3EA;--bad:#B3261E;--bad-soft:#FBE9E7;--warn:#8A5A00;--warn-soft:#FFF4DA;--blue:#245DB0;--blue-soft:#E7EEFA;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12110E;--card:#1C1A16;--ink:#EEE9DF;--ink2:#BDB5A6;--ink3:#8D8577;--line:#2E2B25;--line2:#3D3931;--acc:#E2B355;--acc-soft:#3A2F18;--good:#5CCB86;--good-soft:#173322;--bad:#FF8A7E;--bad-soft:#3B1C19;--warn:#F2C062;--warn-soft:#3A2E12;--blue:#83B1FF;--blue-soft:#1A2740;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
html[dir=rtl] body{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",system-ui,sans-serif;line-height:1.95;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:1rem;margin:14px 0 6px}
.n,.w,input.num,input[type=date],.pin{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
.n,.w{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
html[dir=rtl] .w{direction:rtl}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
small,.hint{color:var(--ink3);font-size:.85em}
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 90px}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:52px}
.brand{flex:1;min-width:0;text-align:start;background:none;border:0;font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;line-height:1;flex:none}
.lang{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:4px 10px;min-height:40px;flex:none}
.sync{display:flex;align-items:center;gap:6px;border:0;background:none;font-size:.82rem;color:var(--ink2);white-space:nowrap;padding:4px 6px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--good)}
.sync.busy i{background:var(--acc);animation:p 1s infinite}.sync.warn i{background:var(--warn)}
@keyframes p{50%{opacity:.3}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.ph-r{display:flex;gap:6px;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:.9rem}
.hello{color:var(--ink2);margin:2px 2px 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}
.bh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.note{border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:.9rem}.note.warn{background:var(--warn-soft);color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:0 0 12px}
.card{display:flex;flex-direction:column;gap:2px;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card span{font-size:.85rem;color:var(--ink2)}.card b{font-size:1.25rem}.card small{font-size:.8rem}
button.card:active{background:var(--bg)}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
@media (max-width:600px){.menu{grid-template-columns:repeat(2,1fr)}}
.mbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:1rem}
.mbtn i{font-style:normal;font-size:1.35rem;line-height:1.2;color:var(--acc)}
.mbtn.in{border-color:var(--good);background:var(--good-soft)}.mbtn.in i{color:var(--good)}
.mbtn.out{border-color:var(--blue);background:var(--blue-soft)}.mbtn.out i{color:var(--blue)}
.mbtn.exp i{color:var(--bad)}
.mbtn:active{transform:scale(.98)}
.menu2{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-weight:600;white-space:nowrap}
.btn.sm{min-height:38px;padding:0 12px;font-size:.9rem}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#1A1305}}
.btn.big{min-height:52px;font-size:1.05rem;padding:0 26px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:active{transform:scale(.98)}

<div id="root"></div>
<script>
/* ================= YOUR SHEET LINK (optional) =================
   Paste your Google Sheet web app link between the quotes below and the app will
   never ask for it on any phone. Leave it empty and each phone asks once.
   Example:  var SHEET_URL = 'https://script.google.com/macros/s/AKfy....../exec';
================================================================ */
var SHEET_URL = '';

window.__PWA = true; // this copy is the installed offline app
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }

/* ================= ENGINE: every number in the app comes from here ================= */
var MN = 40; // 1 maund = 40 kg
function r2(n) { return Math.round((+n || 0) * 100) / 100; }
function catOf(cfg, it) { return it ? (cfg.cats || []).find(function (c) { return c.id === it.cat; }) : null; }
function isBag(cfg, it) { if (!it) return false; var c = catOf(cfg, it); if (c) return c.kind === 'bags'; return it.unit === 'bag'; }
function bagKgOf(it, bagKg) { return +bagKg > 0 ? +bagKg : (it && +it.bagKg > 0 ? +it.bagKg : 50); }
// kg in one "big unit" of this item: a maund (40) for grain, a bag for fertilizer
function bigKg(cfg, it, bagKg) { return isBag(cfg, it) ? bagKgOf(it, bagKg) : MN; }
// kg in the unit a rate is quoted in
function rateKg(it, rUnit, bagKg) { return rUnit === 'kg' ? 1 : rUnit === 'bag' ? bagKgOf(it, bagKg) : rUnit === 'maund' ? MN : 1; }
function amountOf(kg, rate, it, rUnit, bagKg) { return Math.round((+kg || 0) * (+rate || 0) / rateKg(it, rUnit, bagKg)); }
function extrasSum(x) { return x ? (+x.transport || 0) + (+x.labor || 0) + (+x.tulai || 0) + (+x.other || 0) : 0; }
function billedKg(t) { return Math.max(0, (+t.qty || 0) - (t.type === 'sale' ? (+t.kat || 0) : 0)); }

function txSort(a, b) {
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  if ((a.at || 0) !== (b.at || 0)) return (a.at || 0) - (b.at || 0);
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}

function compute(cfg, partiesObj, txObj) {
  var itemById = {};
  (cfg.items || []).forEach(function (it) { itemById[it.id] = it; });
  var items = {};
  function S(id) {
    return items[id] || (items[id] = {
      id: id, kg: 0, val: 0, lastAvg: 0, openKg: 0, openVal: 0,
      purKg: 0, purGross: 0, purKat: 0, purGoods: 0, purExtras: 0, purVal: 0, purN: 0,
      salKg: 0, salBilled: 0, salRev: 0, cogs: 0, salN: 0, salKat: 0,
      lossKg: 0, lossVal: 0, prKg: 0, prAmt: 0, srKg: 0, srAmt: 0, retDiff: 0, moves: []
    });
  }
  (cfg.items || []).forEach(function (it) { S(it.id); });
  var os = (cfg.opening && cfg.opening.stock) || {};
  Object.keys(os).forEach(function (id) {
    var s = S(id), kg = +os[id].kg || 0, c = +os[id].cost || 0;
    s.kg = s.openKg = kg; s.val = s.openVal = kg * c; s.lastAvg = c;
  });

  var accKind = {};
  (cfg.accounts || []).forEach(function (a) { accKind[a.id] = a.kind; });
  var accounts = {}, oc = (cfg.opening && cfg.opening.cash) || {};
  function A(id) { return accounts[id] || (accounts[id] = { id: id, open: 0, bal: 0, inSum: 0, outSum: 0, rows: [], counts: {}, missing: !accKind[id] }); }
  (cfg.accounts || []).forEach(function (a) { var x = A(a.id); x.open = x.bal = +oc[a.id] || 0; });

  var parties = {};
  function P(id) {
    return parties[id] || (parties[id] = { id: id, open: 0, bal: 0, sales: 0, purchases: 0, received: 0, paid: 0, retIn: 0, retOut: 0, purCash: 0, saleCash: 0, adj: 0, rows: [], last: '', n: 0 });
  }
  Object.keys(partiesObj || {}).forEach(function (k) { var p = partiesObj[k]; var x = P(p.id); x.open = x.bal = +p.opening || 0; x.del = !!p.del; });

  var days = {};
  function D(d) { return days[d] || (days[d] = { rev: 0, cogs: 0, exp: 0, loss: 0, retDiff: 0, purGoods: 0, purLanded: 0, adj: 0, n: 0, cats: {}, items: {} }); }
  function DI(day, id) { return day.items[id] || (day.items[id] = { rev: 0, cogs: 0, salKg: 0, salBilled: 0, purKg: 0, purGoods: 0, purVal: 0, lossKg: 0, lossVal: 0, retDiff: 0 }); }

  function cashIn(acc, amt, t, kind) {
    if (!acc || !amt) return; var a = A(acc); a.bal += amt; a.inSum += amt;
    a.rows.push({ id: t.id, date: t.date, kind: kind, inAmt: amt, outAmt: 0, bal: a.bal });
  }
  function cashOut(acc, amt, t, kind) {
    if (!acc || !amt) return; var a = A(acc); a.bal -= amt; a.outSum += amt;
    a.rows.push({ id: t.id, date: t.date, kind: kind, inAmt: 0, outAmt: amt, bal: a.bal });
  }
  // gave = we gave them (goods or money) -> they owe more; got = we got from them
  function post(t, kind, gave, got) {
    if (!t.party) return;
    var p = P(t.party); p.bal += gave - got; p.n++;
    p.rows.push({ id: t.id, date: t.date, kind: kind, gave: gave, got: got, bal: p.bal });
    if (t.date > p.last) p.last = t.date;
    return p;
  }
  function avgOf(s) { return s.kg > 1e-6 ? s.val / s.kg : s.lastAvg; }
  function takeOut(s, qty) { // remove qty from stock at the weighted average cost
    var avg = avgOf(s), cost = avg * qty; s.kg -= qty; s.val -= cost;
    if (Math.abs(s.kg) < 1e-6) { s.kg = 0; s.val = 0; }
    if (s.kg < -1e-6) s.val = s.kg * avg;
    s.lastAvg = avg || s.lastAvg; return { avg: avg, cost: cost };
  }

  var info = {}, warn = { negStock: {} };
  var sorted = Object.keys(txObj || {}).map(function (k) { return txObj[k]; }).filter(function (t) { return t && !t.del; }).sort(txSort);
  sorted.forEach(function (t) {
    if (t.type === 'count') { var ac = A(t.acc || 'cash'); var c = ac.counts[t.date]; if (!c || (t.at || 0) >= (c.at || 0)) ac.counts[t.date] = { amount: +t.amount || 0, at: t.at || 0, id: t.id }; info[t.id] = {}; return; }
    var day = D(t.date); day.n++;
    var it = itemById[t.item];
    switch (t.type) {
      case 'purchase': {
        var s = S(t.item), q = +t.qty || 0, amt = +t.amount || 0, x = extrasSum(t.extras), landed = amt + x;
        s.kg += q; s.val += landed; s.purKg += q; s.purVal += landed; s.purGoods += amt; s.purExtras += x; s.purN++;
        s.purGross += t.gross ? +t.gross : q; s.purKat += +t.kat || 0;
        if (s.kg > 1e-6) s.lastAvg = s.val / s.kg;
        s.moves.push({ id: t.id, date: t.date, kind: 'purchase', inKg: q, outKg: 0, kg: s.kg, amt: amt, rate: t.rate, rUnit: t.rUnit, party: t.party });
        day.purGoods += amt; day.purLanded += landed;
        var di = DI(day, t.item); di.purKg += q; di.purGoods += amt; di.purVal += landed;
        var paid = t.pay && t.pay !== 'credit' ? +t.paid || 0 : 0;
        var bill = amt + (t.xFrom === 'party' ? x : 0);
        var p = post(t, 'purchase', paid, bill); if (p) { p.purchases += bill; p.paid += paid; p.purCash += paid; }
        if (paid) cashOut(t.pay, paid, t, 'purchase');
        if (x && t.xFrom && t.xFrom !== 'party') cashOut(t.xFrom, x, t, 'extras');
        info[t.id] = { landed: landed, extras: x, bill: bill, paid: paid, due: bill - paid, perKg: q > 0 ? landed / q : 0 };
        break;
      }
      case 'sale': {
        var s2 = S(t.item), q2 = +t.qty || 0, amt2 = +t.amount || 0, before = s2.kg;
        var o = takeOut(s2, q2);
        if (s2.kg < -1e-6 && !warn.negStock[t.item]) warn.negStock[t.item] = t.date;
        s2.salKg += q2; s2.salBilled += billedKg(t); s2.salKat += +t.kat || 0; s2.salRev += amt2; s2.cogs += o.cost; s2.salN++;
        s2.moves.push({ id: t.id, date: t.date, kind: 'sale', inKg: 0, outKg: q2, kg: s2.kg, amt: amt2, rate: t.rate, rUnit: t.rUnit, party: t.party });
        day.rev += amt2; day.cogs += o.cost;
        var di2 = DI(day, t.item); di2.rev += amt2; di2.cogs += o.cost; di2.salKg += q2; di2.salBilled += billedKg(t);
        var rec = t.pay && t.pay !== 'credit' ? +t.paid || 0 : 0;
        var p2 = post(t, 'sale', amt2, rec); if (p2) { p2.sales += amt2; p2.received += rec; p2.saleCash += rec; }
        if (rec) cashIn(t.pay, rec, t, 'sale');
        info[t.id] = { cogs: o.cost, avg: o.avg, profit: amt2 - o.cost, received: rec, due: amt2 - rec, stockBefore: before };
        break;
      }
      case 'preturn': { // we send goods back to the supplier
        var s3 = S(t.item), q3 = +t.qty || 0, amt3 = +t.amount || 0;
        var o3 = takeOut(s3, q3); s3.prKg += q3; s3.prAmt += amt3; s3.retDiff += amt3 - o3.cost;
        s3.moves.push({ id: t.id, date: t.date, kind: 'preturn', inKg: 0, outKg: q3, kg: s3.kg, amt: amt3, rate: t.rate, rUnit: t.rUnit, party: t.party });
        day.retDiff += amt3 - o3.cost; DI(day, t.item).retDiff += amt3 - o3.cost;
        var ref = t.pay && t.pay !== 'credit' ? +t.paid || 0 : 0;
        var p3 = post(t, 'preturn', amt3, ref); if (p3) p3.retOut += amt3;
        if (ref) cashIn(t.pay, ref, t, 'preturn');
        info[t.id] = { cost: o3.cost, diff: amt3 - o3.cost, refund: ref, due: amt3 - ref };
        break;
      }
      case 'sreturn': { // a buyer brings goods back
        var s4 = S(t.item), q4 = +t.qty || 0, amt4 = +t.amount || 0, avg4 = avgOf(s4), cost4 = avg4 * q4;
        s4.kg += q4; s4.val += cost4; s4.srKg += q4; s4.srAmt += amt4; s4.salRev -= amt4; s4.cogs -= cost4;
        if (s4.kg > 1e-6) s4.lastAvg = s4.val / s4.kg;
        s4.moves.push({ id: t.id, date: t.date, kind: 'sreturn', inKg: q4, outKg: 0, kg: s4.kg, amt: amt4, rate: t.rate, rUnit: t.rUnit, party: t.party });
        day.rev -= amt4; day.cogs -= cost4; var di4 = DI(day, t.item); di4.rev -= amt4; di4.cogs -= cost4;
        var rf = t.pay && t.pay !== 'credit' ? +t.paid || 0 : 0;
        var p4 = post(t, 'sreturn', rf, amt4); if (p4) p4.retIn += amt4;
        if (rf) cashOut(t.pay, rf, t, 'sreturn');
        info[t.id] = { cost: cost4, refund: rf, due: amt4 - rf };
        break;

  Object.keys(D.items).forEach(function (id) { if (D.items[id].kg < -0.01) issues.push(L('Stock below zero: ', 'اسٹاک صفر سے کم: ') + esc(itemName(id)) + ' (' + fmtW(id, D.items[id].kg) + ')'); });
  live.forEach(function (t) {
    if (t.item && !ST.cfg.items.some(function (i) { return i.id === t.item; })) issues.push(L('Entry with a removed grain on ', 'ہٹائی گئی جنس کا اندراج ') + dShort(t.date));
    if (t.party && !ST.parties[t.party]) issues.push(L('Entry with a missing party on ', 'غائب پارٹی کا اندراج ') + dShort(t.date));
    if ((t.type === 'purchase' || t.type === 'sale') && t.qty && t.rate && Math.abs(amountOf(billedKg(t), t.rate, itemOf(t.item), t.rUnit, t.bagKg) - t.amount) > 1) issues.push(L('Amount does not match weight × rate: ', 'رقم وزن × ریٹ کے برابر نہیں: ') + esc(txTitle(t)) + ' ' + dShort(t.date) + ' (' + money(t.amount) + ' / ' + money(amountOf(billedKg(t), t.rate, itemOf(t.item), t.rUnit, t.bagKg)) + ')');
  });
  return '<table class="kv">' + kv(L('Entries', 'اندراجات'), N(live.length) + (all.length > live.length ? ' <small>(+' + (all.length - live.length) + ' ' + L('deleted', 'حذف شدہ') + ')</small>' : '')) + kv(L('Parties', 'پارٹیاں'), N(Object.values(ST.parties).filter(function (p) { return !p.del; }).length)) +
    kv(L('Stock value', 'مال کی مالیت'), rs(D.tot.stockVal)) + kv(L('Cash', 'نقد'), rs(D.tot.cash)) + kv(L('Bank', 'بینک'), rs(D.tot.bank)) + kv(L('To receive', 'لینا'), rs(D.tot.recv)) + kv(L('To pay', 'دینا'), rs(D.tot.pay)) +
    '<tr class="tot"><td>' + L('Net assets (stock + cash + bank + lena − dena)', 'خالص اثاثے (مال + نقد + بینک + لینا − دینا)') + '</td><td class="r">' + rs(D.tot.worth) + '</td></tr></table>' +
    (issues.length ? '<div class="note warn"><b>' + L('Please look at:', 'ان پر نظر ڈالیں:') + '</b><br>' + issues.slice(0, 20).join('<br>') + '</div>' : '<div class="diff ok">✓ ' + L('No problems found', 'کوئی مسئلہ نہیں ملا') + '</div>');
}

  add(4, { type: 'payment', party: 'd_haji', acc: 'cash', amount: 30000 }); ex(4, 'loading', 1200);
  add(5, { type: 'owner', dir: 'in', acc: 'cash', amount: 50000, note: L('From my pocket', 'اپنی جیب سے') }); g(5, 'purchase', 'wheat', 'd_haji', 1600, 5100, 'cash', 100000);
  var s6 = g(6, 'sale', 'wheat', 'd_malik', 1800, 5500, 'cash', 150000); ex(6, 'rent', 15000); add(6, { type: 'loss', item: 'wheat', qty: 12, qUnit: 'maund', reason: 'moisture' });
  add(7, { type: 'receipt', party: 'd_malik', acc: 'cash', amount: 80000 }); g(7, 'sreturn', 'wheat', 'd_sid', 80, 5450, 'credit');
  g(8, 'purchase', 'urea', 'd_rana', 1500, 4500, 'credit'); g(8, 'sale', 'paddy', 'd_malik', 1200, 4050, 'cash'); ex(8, 'commission', 2000);
  add(9, { type: 'payment', party: 'd_aslam', acc: 'cash', amount: 50000 }); g(9, 'sale', 'urea', 'd_nazir', 750, 4800, 'cash', 40000); g(9, 'preturn', 'paddy', 'd_aslam', 80, 3700, 'credit'); ex(9, 'petty', 400);
  g(10, 'purchase', 'wheat', 'd_ad', 750, 5050, 'cash', null, { kat: 5 }); g(10, 'sale', 'wheat', 'd_sid', 800, 5500, 'credit'); ex(10, 'petty', 250);
  // cash short on day 2 and 6, extra on day 4: each recorded as a correction in the evening
  [[2, 'down', 500], [4, 'up', 200], [6, 'down', 1200]].forEach(function (c) { add(c[0], { type: 'adjust', acc: 'cash', dir: c[1], amount: c[2], note: L('Cash count difference', 'کیش گنتی کا فرق') }, '19'); });
  // capital entered on the first morning
  var R0 = compute(cfg, P, {}), capAt = Date.parse(S + 'T08:00:00');
  cfg.capital = { amount: 950000, simple: false, date: S, at: capAt, gapAtSet: R0.tot.worth - 950000, hist: [{ amount: 950000, date: S, at: capAt, gap: R0.tot.worth - 950000 }] };
  // evening cash counts for days 1-9; day 9 is left 300 short and not yet recorded
  var R1 = compute(cfg, P, X);
  for (var i = 1; i <= 9; i++) { var cd = cashDay(R1, ['cash'], day(i)); add(i, { type: 'count', acc: 'cash', amount: Math.round(cd.close) + (i === 9 ? -300 : 0) }, '20'); }
  // one entry with a change in its history
  var v1 = Object.assign({}, s6, { rate: 5450, amount: Math.round(1800 * 5450 / 40) }); s6.up = s6.at + 3600000;
  var A = { da1: { id: 'da1', at: s6.at, act: 'create', kind: 'tx', ref: s6.id, before: null, after: v1 }, da2: { id: 'da2', at: s6.up, act: 'edit', kind: 'tx', ref: s6.id, before: v1, after: Object.assign({}, s6) } };
  return { cfg: cfg, parties: P, tx: X, audit: A };
}

/* ================= RECEIVABLES / PAYABLES (لینا / دینا) ================= */
function duesRows() {
  var D = R(), out = { recv: [], pay: [], settled: 0 };
  Object.values(ST.parties).forEach(function (p) {
    if (p.del) return;
    var b = D.parties[p.id] || { open: +p.opening || 0, bal: +p.opening || 0, rows: [], last: '' };
    var gave = b.open > 0 ? b.open : 0, got = b.open < 0 ? -b.open : 0;
    b.rows.forEach(function (r) { gave += r.gave; got += r.got; });
    var o = { id: p.id, name: p.name, bal: b.bal, last: b.last, gave: gave, got: got };
    if (b.bal > 0.5) out.recv.push(o); else if (b.bal < -0.5) out.pay.push(o); else if (b.rows.length || b.open) out.settled++;
  });
  out.recv.sort(function (a, b) { return b.bal - a.bal; }); out.pay.sort(function (a, b) { return a.bal - b.bal; });
  return out;
}
SCREENS.dues = function () {
  var d = duesRows(), tab = UI.duesTab || 'recv', list = d[tab], isR = tab === 'recv';
  var tR = d.recv.reduce(function (s, x) { return s + x.bal; }, 0), tP = d.pay.reduce(function (s, x) { return s - x.bal; }, 0);
  var h = pageHead(L('Receivables / Payables', 'لینا / دینا'), L('Part payments reduce the balance; full payment makes it zero. Tap a name for the full history.', 'جزوی رقم سے بقایا کم ہوتا ہے، پوری رقم سے صفر۔ مکمل ہسٹری کے لیے نام پر دبائیں۔'));
  h += '<div class="seg duestab"><button class="' + (isR ? 'on' : '') + '" data-act="duesTab" data-v="recv">' + L('To receive', 'جن سے لینا ہے') + '<b class="good">' + rs(tR) + '</b></button><button class="' + (!isR ? 'on' : '') + '" data-act="duesTab" data-v="pay">' + L('To pay', 'جن کو دینا ہے') + '<b class="bad">' + rs(tP) + '</b></button></div>';
  if (!list.length) h += '<section class="box">' + empty(isR ? L('Nobody owes you anything.', 'کسی سے کوئی رقم لینی نہیں۔') : L('You owe nobody anything.', 'کسی کو کوئی رقم دینی نہیں۔')) + '</section>';
  else h += list.map(function (x) {
    var tot = isR ? x.gave : x.got, done = isR ? x.got : x.gave, rem = Math.abs(x.bal);
    return '<section class="box due"><div class="due-h click" data-act="go" data-to="party" data-id="' + x.id + '"><b>' + esc(x.name) + '</b>' + (x.last ? '<small>' + L('last entry ', 'آخری انٹری ') + dShort(x.last) + ' ›</small>' : '') + '</div>' +
      '<div class="due-n"><div><span>' + L('Total', 'کل رقم') + '</span>' + N(Math.round(tot)) + '</div><div><span>' + (isR ? L('Received', 'وصول ہوئی') : L('Paid', 'ادا ہوئی')) + '</span>' + N(Math.round(done)) + '</div><div><span>' + L('Remaining', 'باقی بقایا') + '</span><b class="' + (isR ? 'good' : 'bad') + '">' + N(Math.round(rem)) + '</b></div></div>' +
      '<div class="due-a"><button class="btn sm pri" data-act="duesPay" data-id="' + x.id + '" data-type="' + (isR ? 'receipt' : 'payment') + '" data-amt="' + Math.round(rem * 100) / 100 + '">' + (isR ? L('Receive money', 'رقم وصول کریں') : L('Pay money', 'رقم ادا کریں')) + '</button><button class="btn sm" data-act="go" data-to="party" data-id="' + x.id + '">' + L('History', 'ہسٹری') + '</button><button class="link small" data-act="duesClear" data-id="' + x.id + '">' + L('Clear old balance', 'پرانا بقایا ختم کریں') + '</button></div></section>';
  }).join('');
  if (d.settled) h += '<p class="hint">' + d.settled + ' ' + L('parties fully settled (balance 0). Their history stays in Party khata.', 'پارٹیوں کا حساب مکمل (بقایا صفر)۔ ان کی ہسٹری پارٹی کھاتے میں محفوظ ہے۔') + '</p>';
  h += '<p class="hint">' + L('Receive: cash goes up, their balance goes down. Pay: cash goes down, the balance goes down. The amount is filled with the full balance; change it for a part payment.', 'وصولی سے دکان کا کیش بڑھتا اور بقایا کم ہوتا ہے۔ ادائیگی سے کیش کم اور بقایا کم ہوتا ہے۔ رقم میں پورا بقایا لکھا آتا ہے؛ جزوی رقم ہو تو بدل دیں۔') + '</p>';
  return h;
};

  var p = ST.parties[el.dataset.id], b = (R().parties[p.id] || {}).bal || 0; if (Math.abs(b) < 0.5) return;
  ask(L('Clear this old balance?', 'یہ پرانا بقایا ختم کریں؟'), esc(p.name) + ': ' + balTxt(b) + '<br><br>' + L('Only for an old or wrong balance that will never be paid in cash. Cash does not change. A correction entry is saved in the history; nothing is deleted.', 'صرف اس پرانے یا غلط بقایا کے لیے جو کبھی نقد ادا نہیں ہوگا۔ کیش نہیں بدلے گا۔ ہسٹری میں درستی کی انٹری محفوظ ہوگی، کچھ حذف نہیں ہوگا۔'), L('Clear to 0', 'صفر کریں'), function () {
    saveTx({ type: 'adjust', date: today(), party: p.id, dir: b < 0 ? 'up' : 'down', amount: Math.round(Math.abs(b) * 100) / 100, note: L('Old balance cleared', 'پرانا بقایا ختم کیا') });
    toast(L('Balance is now 0', 'بقایا صفر ہو گیا'));
  }, true);
};
